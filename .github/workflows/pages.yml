
name: Deploy InterpreterPLATO Visualizer

on:
  push:
    branches: [main]
    paths:
      - "InterpreterPLATO-Visualizer.html"
      - "visualizer/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify selected standalone Visualizer
        run: node visualizer/verify-published.cjs

      - name: Stage selected HTML without rebuilding
        run: |
          mkdir -p _site
          cp InterpreterPLATO-Visualizer.html _site/index.html

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
