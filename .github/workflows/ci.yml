name: offline-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock
      - name: Install locked dependencies
        run: python -m pip install --requirement requirements-dev.lock
      - name: Install package without re-resolving
        run: python -m pip install --no-deps .
      - name: Run offline tests
        run: python -m pytest
      - name: Smoke-test console entry point
        run: interpreter-plato --help

  visualizer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend test dependencies only
        run: npm ci --prefix visualizer --ignore-scripts
      - name: Test graph semantics and browser interaction logic
        run: npm test --prefix visualizer
      - name: Build standalone viewer without embedded runs
        run: node visualizer/build.cjs --output "$RUNNER_TEMP/InterpreterPLATO-Visualizer.html"
      - name: Verify selected five-case publication and payload identities
        run: node visualizer/verify-published.cjs
